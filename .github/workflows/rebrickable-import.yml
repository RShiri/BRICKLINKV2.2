name: Rebrickable catalog import

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary requests
      - name: Import catalog CSVs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.import_rebrickable
      - name: Map BrickLink ids
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m etl.map_bricklink_ids
      - name: Revalidate web pages
        if: ${{ vars.REVALIDATE_URL != '' }}
        env:
          REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" || true
